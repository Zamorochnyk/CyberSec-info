version: '3.9'

services:
  cyber-chef:
    restart: no
    image: mpepping/cyberchef:latest
    ports:
      - 8000:8000
     
  pentest-tools:
    build:
      context: ./build
      args: 
      - PASS=hack
    restart: no
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
    cap_add: 
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 94.140.14.14
      - 1.1.1.1
    volumes:
      - ./transf:/transf
      - /etc/localtime.ro:/etc/localtime:ro
      - /etc/timezone.ro:/etc/timezone:ro
    ports:
      - 120:22
      - 8081:8080 # default for mitmproxy
      - 9990-9999:9990-9999 # Misc ports for whatever